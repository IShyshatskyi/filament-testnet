name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests, the loopback P2P tests and the shared consensus vectors
      # (crates/filament-types/tests/vectors/consensus_v1.json, generated by the node).
      - name: cargo test --workspace
        run: cargo test --workspace --features full-node
