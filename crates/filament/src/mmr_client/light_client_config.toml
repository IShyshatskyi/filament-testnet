genesis_bits = 0x03000040

genesis_mmr_root = "32b14ff02f18f19a4a66c4b5dd837e2ff14548a0b13f295a603c176503000040"

# Bitcoin anchor: block 964050 (internal/reversed byte order — see the note on the
