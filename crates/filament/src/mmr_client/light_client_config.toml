# Light client synchronization settings
[sync]
# Number of recent blocks to cache
recent_blocks_cache_size = 100

# How often to poll for updates (seconds)
poll_interval_secs = 10

# Maximum concurrent requests to peers
max_concurrent_requests = 10

# Batch size for range proofs
range_proof_batch_size = 100

# Request timeout (seconds)
request_timeout_secs = 30

# Paranoid mode - verify all proofs even from trusted checkpoints
paranoid_mode = false


# Checkpoint configuration (for fast sync)
# Light clients can start from recent checkpoints instead of genesis
[checkpoints.mainnet]
# Example checkpoint at height 100,000
# Add these after network has been running for a while
# height_100000 = "checkpoint_hash_here"


