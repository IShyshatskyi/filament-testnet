# ============================================================================
# IMPORTANT NOTES ON GENESIS CONFIGURATION
# ============================================================================
#
# Genesis Block Structure:
# ========================
#
# For ALL networks (mainnet, testnet1, testnet3, devnet):
#
# 1. prev_block_hash = bitcoin_anchor_hash
#    - NOT zero hash!
#    - Links genesis to Bitcoin blockchain
#    - Prevents pre-mining
#
# 2. prev_mmr_root = bitcoin_anchor_hash
#    - Initial MMR state equals Bitcoin anchor
#    - First block in chain builds on this root
#
# 3. current_mmr_root = genesis_hash
#    - After mining genesis, its hash becomes the MMR root
#    - This is what gets set in genesis_mmr_root field above
#
# 4. hash = genesis_hash
#    - The actual genesis block hash after mining
#    - Calculated from header fields
#
#
# Configuration Workflow:
# =======================
#
# BEFORE genesis mining:
# - Set bitcoin_anchor_hash to chosen Bitcoin block
# - Set bitcoin_anchor_height to that block's height
# - Leave genesis_hash as zeros (will be calculated)
# - Leave genesis_mmr_root as zeros (will equal genesis_hash)
#
# AFTER genesis mining:
# - Set genesis_hash to the mined block's hash
# - Set genesis_mmr_root to the same value (equals genesis_hash)
# - Bitcoin anchor fields remain unchanged
#
#
# Validation in Light Client:
# ============================
#
# When light client loads genesis:
# 1. Reads bitcoin_anchor_hash from config
# 2. Creates genesis block with:
#    - prev_block_hash = bitcoin_anchor_hash
#    - prev_mmr_root = bitcoin_anchor_hash
#    - current_mmr_root = genesis_mmr_root (from config)
#    - hash = genesis_hash (from config)
#
# 3. Validates that genesis matches expected structure
# 4. Uses this as trusted starting point for verification
#
#
# Security Model:
# ===============
#
# The Bitcoin anchor prevents:
# - Pre-mining (can't mine before Bitcoin anchor exists)
# - Time manipulation (timestamp must be after Bitcoin block)
# - Chain rewriting (genesis is cryptographically linked to Bitcoin)
#
# Light clients trust:
# - The genesis_hash in this config file (hardcoded)
# - The bitcoin_anchor_hash in this config file (hardcoded)
# - That these values are correct and match the network
#
# Light clients verify:
# - All blocks after genesis using MMR proofs
# - That proofs link back to trusted genesis_mmr_root
# - That chain has highest cumulative difficulty
#
# ============================================================================