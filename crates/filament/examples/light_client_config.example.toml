# Filament bootstrap config (FilamentBootstrapConfig) used by examples/quickstart.rs.
# Parsed by a unit test in src/mmr_client/light_client_config.rs so the schema cannot drift.
#
# The network tables below are DERIVED, not typed: genesis_hash and genesis_mmr_root come from
# `GenesisGenerator::generate_beacon_genesis` on each network's `BeaconGenesisConfig` preset, and
# the other fields are the preset's. A unit test (`bootstrap_config_matches_presets`) compares this
# file with the presets, so a drift fails the build. Hashes are in internal byte order (the same
# order the nodes write into prev_mmr_root), the reverse of a block explorer's display.
# `devnet` is the stock preset; a local soak genesis has its own hash, so pass its genesis file
# (`init_from_genesis_file`) instead of trusting this table for it.

