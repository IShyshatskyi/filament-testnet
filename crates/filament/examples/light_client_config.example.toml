# Filament bootstrap config (FilamentBootstrapConfig) used by examples/quickstart.rs.
# Every network table is required; fill in the genesis values of the network you join
# (genesis_hash / genesis_mmr_root from that network's genesis). Parsed by a unit test
# in src/mmr_client/light_client_config.rs so the schema cannot drift.

[devnet]
network_id               = "devnet"
genesis_hash             = "REPLACE_WITH_GENESIS_HASH_HEX"
genesis_height           = 0
genesis_timestamp        = 1704067200
genesis_difficulty       = 64
genesis_bits             = 0x03000040
genesis_mmr_root         = "REPLACE_WITH_GENESIS_MMR_ROOT_HEX"
bitcoin_anchor_hash      = "4ae19982df01cb02b282c9fd53076599d5d2791333a200000000000000000000"
bitcoin_anchor_height    = 935093
bitcoin_anchor_timestamp = 1704067200

