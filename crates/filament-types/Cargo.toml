[package]
name        = "filament-types"
version     = "0.1.0"
edition     = "2021"
description = "Wire types and proof/MMR primitives for the Filament light client"
license     = "MIT"

[features]
default   = []
# Optional full-node UTXO path (rustmmrdb). Not wired in the public tree;
# kept for API parity with private common-types cfg gates.
full-node = []

[dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
blake3      = "1.6.1"
sha2        = "0.10"
secp256k1   = { version = "0.29", features = ["rand"] }
hex         = "0.4"
bincode     = { version = "2", features = ["serde"] }
bit-vec     = "0.8.0"
log         = "0.4"
lru         = "0.12"
parking_lot = "0.12"
rand        = "0.10"
rustc-hash  = "2.0"
toml        = "0.8"

[dev-dependencies]
tempfile = "3"
proptest = "1"
