[package]
name        = "filament-types"
version     = "0.1.0"
edition     = "2021"
description = "Minimal wire types and proof-verification primitives for the Filament light client (clean-room implementation)"
license     = "MIT"

[dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3     = "1.6.1"
sha2       = "0.10"
secp256k1  = { version = "0.29", features = ["rand-std"] }
hex        = "0.4"
bincode    = { version = "2.0", features = ["serde"] }
toml       = "0.8"

[dev-dependencies]
